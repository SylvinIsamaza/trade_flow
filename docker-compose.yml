version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tradeflow_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./:/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 3000s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - tradeflow_network

  minio:
    image: minio/minio:latest
    container_name: tradeflow_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped
    networks:
      - tradeflow_network

volumes:
  minio_data:
    driver: local

networks:
  tradeflow_network:
    driver: bridge